<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rain Meter</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rain Meter">
<meta name="theme-color" content="#0b1220">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Unbounded:wght@600;800&family=Manrope:wght@400;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: tarjetas tipo app del clima (fondo según estado) + satélite animado a todo el ancho */
:root{
  --bg:#0b1220; --line:#ffffff1f; --fg:#f4f8ff; --muted:#c9d6ecb3;
  --hail:#c4b2ff; --rain:#4cc3ff; --sun:#ffd43b;
  --ok:#3ee0a5; --warn:#ffbe4d; --bad:#ff5a6e; --none:#ffffff14;
  --sky0a:#2f7fe0; --sky0b:#1b4fa3;   /* calmo */
  --sky1a:#6a55c9; --sky1b:#2d2a6b;   /* atención */
  --sky2a:#3a3550; --sky2b:#14121f;   /* alto */
  --f-display:"Unbounded",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,sans-serif;
  --f-data:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);padding-inline:16px;padding-block:28px 40px;
  background-image:radial-gradient(900px 500px at 85% -10%,#22305a66,transparent 60%),radial-gradient(700px 400px at -10% 110%,#0f4a5c44,transparent 60%)}
.wrap{max-width:900px;margin:0 auto;display:grid;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}
h1{font:800 clamp(22px,4.5vw,32px)/1.05 var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 span.x{background:linear-gradient(90deg,var(--hail),var(--rain));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand{display:flex;align-items:center;gap:clamp(10px,2.5vw,20px);flex-wrap:wrap}
.logo{height:clamp(40px,7vw,62px);width:auto;filter:drop-shadow(0 6px 14px #0007)}
.rm{font:400 clamp(24px,4.8vw,40px)/.88 "Anton","Impact",sans-serif;text-transform:uppercase;letter-spacing:.01em;
  background:linear-gradient(180deg,#ffffff 0%,var(--rain) 55%,var(--hail) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 #000) drop-shadow(0 8px 16px #0008)}
.alert{border-radius:22px;padding:16px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;color:#fff;
  background:var(--ac);box-shadow:0 14px 34px color-mix(in srgb,var(--ac) 45%,transparent);border:1px solid #ffffff33}
.alert.a0{--ac:#1fae73} .alert.a1{--ac:#f07a12} .alert.a2{--ac:#e8283c}
.alert .lvl{font:400 clamp(26px,5vw,38px)/1 "Anton","Impact",sans-serif;text-transform:uppercase;letter-spacing:.02em}
.alert .txt{display:grid;gap:2px;min-width:0;flex:1}
.alert .sub{font-weight:700;opacity:.95}
.alert .pct{margin-left:auto;text-align:right;display:grid}
.alert .pct b{font:400 clamp(34px,7vw,52px)/1 "Anton","Impact",sans-serif}
.alert .pct span{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.9}
@media (max-width:520px){.alert .txt{flex:1 1 200px}.alert .pct{margin-left:0;text-align:left;width:100%;display:flex;align-items:baseline;gap:8px}}
@media (prefers-reduced-motion:no-preference){.alert.a2{animation:alertpulse 1.6s ease-in-out infinite}}
@keyframes alertpulse{50%{box-shadow:0 0 0 6px #e8283c55,0 14px 34px #e8283c88}}
.hright{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.meta{font:500 12px var(--f-data);color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,390px),1fr));gap:18px}
svg.ic{width:var(--s,28px);height:var(--s,28px);flex:none;overflow:visible}

.card{border-radius:26px;padding:20px;display:grid;gap:16px;min-width:0;border:1px solid var(--line);
  background:linear-gradient(165deg,var(--a),var(--b));box-shadow:0 20px 40px #0006}
.card.s0{--a:var(--sky0a);--b:var(--sky0b)} .card.s1{--a:var(--sky1a);--b:var(--sky1b)} .card.s2{--a:var(--sky2a);--b:var(--sky2b)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.top h2{font:700 18px var(--f-body);margin:0}
.top small{display:block;color:var(--muted);font-size:13px}
.now{display:flex;align-items:center;gap:10px}
.now .t{font:600 40px/1 var(--f-display);letter-spacing:-.03em}
.pills{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pill{border-radius:18px;padding:12px;background:#0000002e;backdrop-filter:blur(8px);display:flex;align-items:center;gap:10px;min-width:0}
.pill div{display:grid;min-width:0}
.pill .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800}
.pill .v{font:800 18px var(--f-display)}
.lv0 .v{color:var(--ok)} .lv1 .v{color:var(--warn)} .lv2 .v{color:var(--bad)}
.pill.lv2{box-shadow:inset 0 0 0 2px var(--bad)}
.next{display:flex;align-items:center;gap:10px;font-weight:700;background:#0000002e;border-radius:16px;padding:10px 12px}
.next b{font-family:var(--f-data);font-weight:500}
.strip{display:grid;gap:6px}
.row{display:grid;grid-template-columns:30px 1fr;align-items:center;gap:8px}
.cells{display:grid;grid-template-columns:repeat(24,1fr);gap:2px}
.cells i{height:16px;border-radius:4px;background:var(--none)}
.cells i.h1{background:var(--warn)} .cells i.h2{background:var(--bad)}
.cells i.r1{background:var(--warn)} .cells i.r2{background:var(--bad)}
.hours{display:grid;grid-template-columns:30px repeat(4,1fr);gap:0 8px;font:500 10px var(--f-data);color:var(--muted)}
.why{font:500 12px var(--f-data);color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.why em{font-style:normal;color:var(--fg)}

.sat{border-radius:26px;overflow:hidden;border:1px solid var(--line);background:#05080f}
.sathead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px}
.sathead h2{display:flex;align-items:center;gap:8px;font:700 16px var(--f-body);margin:0}
.seg{display:flex;background:#ffffff14;border-radius:999px;padding:3px}
.seg button{background:none;color:var(--muted);padding:7px 14px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--fg);color:#0b1220}
.frame{display:block;width:100%;height:min(70vh,520px);border:0;background:#05080f}
.ctrl{display:flex;align-items:center;gap:10px;flex:1;min-width:220px;max-width:420px}
.ctrl button{padding:8px 12px;font-size:12px;min-width:40px;justify-content:center}
.ctrl input{flex:1;accent-color:var(--rain)}
.rtime{font:500 13px var(--f-data);min-width:44px}
.pin{width:16px;height:16px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 3px #0006,0 0 14px var(--c)}
.leaflet-tooltip.lbl{background:#0b1220e6;color:var(--fg);border:0;border-radius:8px;font:700 12px var(--f-body);box-shadow:none}
.leaflet-tooltip.lbl::before{display:none}
.leaflet-container{background:#05080f;font-family:var(--f-body)}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.live{position:absolute;left:12px;bottom:12px;font:500 11px var(--f-data);background:#000a;padding:4px 8px;border-radius:8px;display:flex;align-items:center;gap:6px}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--bad)}
@media (prefers-reduced-motion:no-preference){.live::before{animation:blink 1.4s infinite}}
@keyframes blink{50%{opacity:.2}}
.mapbox{position:relative;min-height:0}
.risk-pane{filter:blur(1.5px)}
.mbar{position:absolute;left:10px;right:10px;bottom:10px;z-index:800;display:flex;gap:10px;align-items:center;background:#0b1220e0;backdrop-filter:blur(6px);border-radius:14px;padding:7px 10px}
.mbar button{padding:6px 10px;min-width:36px;justify-content:center;font-size:12px}
.mbar input{flex:1;min-width:0;accent-color:var(--rain)}
#mtime{font:500 12px var(--f-data);min-width:96px;text-align:right}
.mleg{position:absolute;top:10px;right:10px;z-index:800;display:flex;gap:10px;background:#0b1220e0;border-radius:10px;padding:6px 10px;font-size:11px;font-weight:700}
.mleg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.satnote{padding:10px 16px 14px;font-size:12px;color:var(--muted)}
.satnote a{color:var(--rain)}

footer{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
button{font:700 14px var(--f-body);color:#0b1220;background:linear-gradient(90deg,var(--hail),var(--rain));border:0;border-radius:999px;padding:12px 20px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
button:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
#notif.on{background:var(--ok)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
[hidden]{display:none!important}
.frame img{color:transparent}
#toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;background:var(--bad);color:#fff;border-radius:16px;padding:14px 16px;font-weight:700;box-shadow:0 10px 30px #0008;display:flex;gap:10px;align-items:center}

@media (orientation:landscape) and (min-width:900px){
/* ===== Versión PC 16:9: todo en una pantalla, mapa a la derecha ===== */
html,body{height:100%}
body{height:100dvh;overflow:hidden;padding-block:clamp(10px,1.8vh,22px);padding-inline:clamp(14px,1.6vw,28px)}
.wrap{max-width:none;height:100%;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);
  grid-template-areas:"head map" "alert map" "cards map";gap:clamp(10px,1.6vh,18px) clamp(14px,1.4vw,24px)}
header{grid-area:head} .alert{grid-area:alert} .sat{grid-area:map}
.grid{grid-area:cards;grid-template-columns:1fr 1fr;min-height:0;gap:clamp(10px,1.2vw,18px)}
.card{min-height:0;overflow:hidden;padding:clamp(12px,1.7vh,20px);gap:clamp(8px,1.4vh,16px);align-content:start}
.sat{display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-height:0}
.mapbox,.frame{height:100%}
.alert{padding:clamp(10px,1.6vh,16px) 20px}
.pill{padding:10px}
.pill .ic{width:32px!important;height:32px!important}
.now .ic{width:44px!important;height:44px!important} .now .t{font-size:clamp(28px,3.6vh,40px)}
@media (max-height:700px){.why{display:none}}
}
@media (orientation:portrait) and (max-width:700px){
/* ===== Versión iPhone 9:16: una sola pantalla vertical ===== */
html,body{height:100%}
body{height:100dvh;overflow:hidden;padding-inline:12px;padding-block:calc(8px + env(safe-area-inset-top,0px)) calc(8px + env(safe-area-inset-bottom,0px));font-size:13px}
.wrap{height:100%;display:flex;flex-direction:column;gap:8px}
header{flex-wrap:nowrap;align-items:center}
.logo{height:30px} .rm{font-size:19px}
.brand{gap:8px;flex-wrap:nowrap}
.meta{display:none}
#notif{padding:8px 10px} #notif .bt{display:none}
.alert{padding:10px 12px;gap:10px;flex-wrap:nowrap;border-radius:16px}
.alert .ic{width:34px!important;height:34px!important}
.alert .lvl{font-size:21px} .alert .sub{font-size:11px;line-height:1.3}
.alert .txt{flex:1 1 auto}
.alert .pct{margin-left:auto;width:auto;display:grid;text-align:right}
.alert .pct b{font-size:28px} .alert .pct span{font-size:8px}
.grid{grid-template-columns:1fr 1fr;gap:8px}
.card{padding:10px;gap:7px;border-radius:18px;align-content:start}
.top h2{font-size:12.5px;line-height:1.2} .top small{display:none}
.now{gap:4px} .now .ic{width:26px!important;height:26px!important} .now .t{font-size:18px}
.pills{grid-template-columns:1fr;gap:5px}
.pill{padding:5px 8px;border-radius:12px;gap:6px}
.pill .ic{width:22px!important;height:22px!important}
.pill .k{font-size:8.5px} .pill .v{font-size:13px}
.next{font-size:10.5px;padding:6px 8px;border-radius:10px;gap:6px;line-height:1.25}
.next .ic{width:18px!important;height:18px!important}
.row{grid-template-columns:16px 1fr;gap:4px} .row .ic{width:16px!important;height:16px!important}
.cells{gap:1px} .cells i{height:8px;border-radius:2px}
.hours,.why,.satnote{display:none}
.sat{flex:1 1 0;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr);border-radius:18px}
.sathead{padding:7px 10px;flex-wrap:nowrap}
.sathead h2{font-size:13px} .sathead h2 .ic{width:20px!important;height:20px!important}
.seg button{padding:5px 9px;font-size:11px}
.mapbox,.frame{height:100%}
}

/* ===== Mapa en pantalla completa: una barra fina arriba con todo, el mapa ocupa el resto ===== */
.sathead{gap:8px}
.mfull{margin-left:auto;width:38px;height:38px;padding:0;justify-content:center;border-radius:12px;background:#ffffff14;color:var(--fg);flex:none}
.mfull svg{width:20px;height:20px}
.mini{display:none}
body.mapfull{height:100dvh;overflow:hidden;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)!important}
body.mapfull .wrap{display:flex!important;flex-direction:column;height:100%;gap:0;max-width:none}
body.mapfull header,body.mapfull .grid,body.mapfull .satnote,body.mapfull .alert,body.mapfull .sathead h2{display:none!important}
body.mapfull .sat{flex:1 1 0;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr);border-radius:0;border:0}
body.mapfull .sathead{padding:6px 8px;flex-wrap:wrap;gap:6px}
body.mapfull .seg button{padding:5px 10px;font-size:12px}
body.mapfull .mfull{width:32px;height:32px;margin-left:0}
body.mapfull .mapbox,body.mapfull .frame{height:100%}
body.mapfull .mini{display:flex;flex:1 1 0;min-width:0;gap:6px;align-items:center}
.abadge{flex:none;font:400 15px/1 "Anton","Impact",sans-serif;letter-spacing:.03em;color:#fff;padding:6px 9px;border-radius:9px;text-transform:uppercase}
.abadge.a0{background:#1fae73} .abadge.a1{background:#f07a12} .abadge.a2{background:#e8283c}
.chip{min-width:0;display:flex;align-items:center;gap:5px;padding:5px 8px;border-radius:9px;background:#ffffff12;border:1px solid var(--line);font:700 11px var(--f-body);white-space:nowrap}
.chip .ic{width:16px!important;height:16px!important}
.chip .l0{color:var(--ok)} .chip .l1{color:var(--warn)} .chip .l2{color:var(--bad)}
@media (max-width:700px){body.mapfull .mini{flex-basis:100%}body.mapfull .seg{margin-right:auto}}
</style>
</head>
<body>
<!-- Íconos multicolor estilo app del clima -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gC" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d4deec"/></linearGradient>
    <linearGradient id="gD" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9aa6bb"/><stop offset="1" stop-color="#5d6880"/></linearGradient>
    <linearGradient id="gS" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe066"/><stop offset="1" stop-color="#ffb000"/></linearGradient>
    <path id="cl" d="M19 50h28a12 12 0 0 0 1.5-23.9A16 16 0 0 0 17.3 30 10 10 0 0 0 19 50z"/>
  </defs>
  <symbol id="i-sun" viewBox="0 0 64 64"><g stroke="#ffc21a" stroke-width="4" stroke-linecap="round"><path d="M32 6v6M32 52v6M6 32h6M52 32h6M13.6 13.6l4.2 4.2M46.2 46.2l4.2 4.2M13.6 50.4l4.2-4.2M46.2 17.8l4.2-4.2"/></g><circle cx="32" cy="32" r="13" fill="url(#gS)"/></symbol>
  <symbol id="i-moon" viewBox="0 0 64 64"><path d="M40 8a24 24 0 1 0 16 38A20 20 0 0 1 40 8z" fill="url(#gS)"/></symbol>
  <symbol id="i-part" viewBox="0 0 64 64"><circle cx="40" cy="22" r="11" fill="url(#gS)"/><g stroke="#ffc21a" stroke-width="3.5" stroke-linecap="round"><path d="M40 4v4M56 22h4M52.7 9.3l-2.8 2.8"/></g><use href="#cl" fill="url(#gC)" transform="translate(-4 4)"/></symbol>
  <symbol id="i-cloud" viewBox="0 0 64 64"><use href="#cl" fill="url(#gC)"/></symbol>
  <symbol id="i-rain" viewBox="0 0 64 64"><use href="#cl" fill="url(#gC)" transform="translate(0 -8)"/><g stroke="#3fb4ff" stroke-width="4" stroke-linecap="round"><path d="M22 48l-3 8M34 48l-3 8M46 48l-3 8"/></g></symbol>
  <symbol id="i-heavy" viewBox="0 0 64 64"><use href="#cl" fill="url(#gD)" transform="translate(0 -10)"/><g stroke="#3fb4ff" stroke-width="4" stroke-linecap="round"><path d="M17 45l-4 11M27 45l-4 11M37 45l-4 11M47 45l-4 11"/></g></symbol>
  <symbol id="i-hail" viewBox="0 0 64 64"><use href="#cl" fill="url(#gD)" transform="translate(0 -10)"/><g fill="#fff" stroke="#8fd3ff" stroke-width="2"><circle cx="20" cy="49" r="4"/><circle cx="33" cy="54" r="4"/><circle cx="46" cy="48" r="4"/><circle cx="27" cy="60" r="3"/></g></symbol>
  <symbol id="i-storm" viewBox="0 0 64 64"><use href="#cl" fill="url(#gD)" transform="translate(0 -10)"/><path d="M34 38l-8 13h7l-4 11 12-16h-7l4-8z" fill="#ffd21a"/><g fill="#fff" stroke="#8fd3ff" stroke-width="2"><circle cx="17" cy="50" r="3.5"/><circle cx="48" cy="52" r="3.5"/></g></symbol>
  <symbol id="i-bolt" viewBox="0 0 64 64"><use href="#cl" fill="url(#gD)" transform="translate(0 -10)"/><path d="M34 38l-8 13h7l-4 11 12-16h-7l4-8z" fill="#ffd21a"/><g stroke="#3fb4ff" stroke-width="4" stroke-linecap="round"><path d="M17 46l-3 8M48 46l-3 8"/></g></symbol>
  <symbol id="i-sat" viewBox="0 0 64 64"><g transform="rotate(-35 32 32)"><rect x="24" y="24" width="16" height="16" rx="3" fill="#dfe7f3"/><rect x="4" y="27" width="17" height="10" rx="2" fill="#3fb4ff"/><rect x="43" y="27" width="17" height="10" rx="2" fill="#3fb4ff"/></g><path d="M44 50a14 14 0 0 0 8-8M44 58a22 22 0 0 0 15-15" stroke="#ffc21a" stroke-width="3.5" fill="none" stroke-linecap="round"/></symbol>
  <symbol id="i-bell" viewBox="0 0 64 64"><path d="M32 8a16 16 0 0 0-16 16v12l-6 8h44l-6-8V24A16 16 0 0 0 32 8z" fill="url(#gS)"/><circle cx="32" cy="52" r="6" fill="#ffb000"/></symbol>
  <symbol id="i-ok" viewBox="0 0 64 64"><circle cx="32" cy="32" r="24" fill="#3ee0a5"/><path d="M21 33l8 8 15-17" stroke="#0b3d2c" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<script>
const PLACES=[
  {id:"cba",name:"Córdoba Capital",sub:"Casa",lat:-31.420,lon:-64.189},
  {id:"aut",name:"Autódromo Cabalén",sub:"Alta Gracia",lat:-31.645,lon:-64.400}
];
const VARS="temperature_2m,is_day,precipitation,precipitation_probability,weather_code,cape,lifted_index,convective_inhibition,freezing_level_height,wind_speed_10m,wind_direction_10m,wind_speed_500hPa,wind_direction_500hPa,temperature_500hPa,wind_gusts_10m";
const LVL=["Bajo","Atención","Alto"];
const $=s=>document.querySelector(s);
const ic=(n,s=28)=>`<svg class="ic" style="--s:${s}px" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const store={get(k){try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let DATA=[];

/* --- Análisis propio: índice de granizo (ingredientes de convección severa) --- */
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const lerp=(x,x0,x1,y0,y1)=>y0+(y1-y0)*clamp((x-x0)/(x1-x0),0,1);
function shear(s1,d1,s2,d2){const r=Math.PI/180;
  const u=s2*Math.sin(d2*r)-s1*Math.sin(d1*r), v=s2*Math.cos(d2*r)-s1*Math.cos(d1*r);return Math.hypot(u,v)}
function hailScore(h){
  const cape=h.cape??0, li=h.lifted_index??0, fz=h.freezing_level_height??4500, cin=h.convective_inhibition??0;
  const sh=shear(h.wind_speed_10m??0,h.wind_direction_10m??0,h.wind_speed_500hPa??0,h.wind_direction_500hPa??0);
  let s = cape<300?0 : cape<1000?lerp(cape,300,1000,0,30) : cape<2500?lerp(cape,1000,2500,30,55) : lerp(cape,2500,4000,55,65);
  if(cape>=300){
    s+=lerp(sh,35,75,0,20);
    s+= fz<3500?10 : fz<4200?5 : fz>4600?-10:0;
    s+= li<-7?15 : li<-4?10 : li<-2?4:0;
    s+= (h.temperature_500hPa??0)<-12?5:0;
    if(cin<-150) s*=0.6;
  }
  const wc=h.weather_code;
  if(wc===95) s+=10;
  const pp=(h.precipitation_probability??0)/100;
  s*= (0.35+0.65*pp);
  if(wc===96||wc===99) s=Math.max(s,75);
  return {s:Math.round(clamp(s,0,100)),sh:Math.round(sh)};
}
function rainLevel(hs,i){
  const p=hs[i].precipitation??0, acc3=(hs[i].precipitation??0)+(hs[i+1]?.precipitation??0)+(hs[i+2]?.precipitation??0);
  const pp=hs[i].precipitation_probability??0;
  if((p>=15||acc3>=30)&&pp>=40) return 2;
  if((p>=6||acc3>=15)&&pp>=30) return 1;
  return 0;
}
const hailLevel=s=>s>=55?2:s>=30?1:0;

function analyze(raw){
  const off=raw.utc_offset_seconds*1000, H=raw.hourly, n=H.time.length, now=Date.now();
  const hs=[...Array(n)].map((_,i)=>{const o={t:Date.parse(H.time[i]+":00Z")-off};for(const k in H)if(k!=="time")o[k]=H[k][i];return o});
  const start=hs.findIndex(h=>h.t+3600e3>now);
  const out=[];
  for(let i=start;i<n&&out.length<24;i++){
    const {s,sh}=hailScore(hs[i]);
    out.push({t:hs[i].t,hs:s,hl:hailLevel(s),rl:rainLevel(hs,i),sh,h:hs[i]});
  }
  return out;
}
function episodes(hours){
  const ev=[];let prev=false;
  for(const h of hours){const risk=h.hl>0||h.rl>0;
    if(risk&&!prev) ev.push(h);
    if(risk&&prev){const e=ev[ev.length-1];e.peakH=Math.max(e.peakH??e.hl,h.hl);e.peakR=Math.max(e.peakR??e.rl,h.rl)}
    prev=risk}
  ev.forEach(e=>{e.peakH??=e.hl;e.peakR??=e.rl});
  return ev;
}
const hhmm=t=>new Date(t).toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit",hourCycle:"h23",timeZone:"America/Argentina/Cordoba"});
function describe(e){
  const p=[];if(e.peakH) p.push("granizo "+LVL[e.peakH].toLowerCase());if(e.peakR) p.push("lluvia intensa "+(e.peakR===2?"alta":"posible"));
  return p.join(" + ");
}
/* Ícono de la hora actual según código del modelo y día/noche */
function nowIcon(h){const c=h.weather_code??0;
  if(c===96||c===99) return "storm"; if(c===95) return "bolt";
  if([65,82].includes(c)) return "heavy"; if((c>=51&&c<=67)||(c>=80&&c<=82)) return "rain";
  if(c===3||c===45||c===48) return "cloud"; if(c===2) return "part";
  return h.is_day? "sun":"moon";
}
const hailIcon=l=>l===2?"storm":l===1?"hail":"ok";
const rainIcon=l=>l===2?"heavy":l===1?"rain":"ok";

/* --- Recuadro de alerta: peor caso de los dos lugares en 12 h --- */
function renderAlert(){
  const ok=DATA.filter(d=>d.hours);const box=$("#alert");
  if(!ok.length){box.className="alert a1";box.innerHTML=`<div class="txt"><span class="lvl">Sin datos</span><span class="sub">No pude bajar el pronóstico. Reintento pronto.</span></div>`;return}
  let w=null;
  for(const d of ok) for(const h of d.hours.slice(0,12)){const lv=Math.max(h.hl,h.rl);
    if(!w||lv>w.lv||(lv===w.lv&&h.hs>w.h.hs)) w={lv,h,d}}
  const NAME=["Alerta verde","Alerta naranja","Alerta roja"];
  const sub=w.lv===0?"Sin riesgo de granizo ni lluvia fuerte en las próximas 12 h"
    :`${w.d.p.name} · desde las ${hhmm(w.h.t)} · ${[w.h.hl?"granizo":"",w.h.rl?"lluvia fuerte":""].filter(Boolean).join(" y ")}`;
  box.className="alert a"+w.lv;
  box.innerHTML=`${ic(w.lv===2?"storm":w.lv===1?"hail":"ok",48)}<div class="txt"><span class="lvl">${NAME[w.lv]}</span><span class="sub">${sub}</span></div>
    <div class="pct"><b>${w.h.hs}%</b><span>Prob. granizo</span></div>`;
}
/* --- Render --- */
function render(){
  renderAlert();renderMini();
  $("#grid").innerHTML=DATA.map(d=>{
    if(!d.hours) return `<section class="card s0"><div class="top"><h2>${d.p.name}</h2></div><div class="next">Sin datos. Reintento en unos minutos.</div></section>`;
    const hrs=d.hours, cur=hrs[0].h, f=hrs.slice(0,12);
    const maxH=Math.max(...f.map(h=>h.hl)), maxR=Math.max(...f.map(h=>h.rl)), st=Math.max(maxH,maxR);
    const ev=episodes(hrs)[0];
    const peak=hrs.reduce((a,b)=>b.hs>a.hs?b:a,hrs[0]);
    const nx=ev?`${ic(ev.peakH?hailIcon(ev.peakH):rainIcon(ev.peakR),30)}<span>Desde las <b>${hhmm(ev.t)}</b> · ${describe(ev)}</span>`
               :`${ic("ok",26)}<span>Sin riesgo en las próximas 24 h</span>`;
    const lab=[0,6,12,18].map(k=>hrs[k]?`<span>${hhmm(hrs[k].t)}</span>`:"<span></span>").join("");
    return `<section class="card s${st}">
      <div class="top">
        <div><h2>${d.p.name}</h2><small>${d.p.sub}</small></div>
        <div class="now">${ic(nowIcon(cur),52)}<span class="t">${Math.round(cur.temperature_2m??0)}°</span></div>
      </div>
      <div class="pills">
        <div class="pill lv${maxH}">${ic(maxH?hailIcon(maxH):"hail",38)}<div><span class="k">Granizo · ${Math.max(...f.map(h=>h.hs))}%</span><span class="v">${LVL[maxH]}</span></div></div>
        <div class="pill lv${maxR}">${ic(maxR?rainIcon(maxR):"rain",38)}<div><span class="k">Lluvia fuerte</span><span class="v">${LVL[maxR]}</span></div></div>
      </div>
      <div class="next">${nx}</div>
      <div class="strip">
        <div class="row">${ic("hail",24)}<div class="cells">${hrs.map(h=>`<i class="h${h.hl}" title="${hhmm(h.t)} · índice ${h.hs}"></i>`).join("")}</div></div>
        <div class="row">${ic("rain",24)}<div class="cells">${hrs.map(h=>`<i class="r${h.rl}" title="${hhmm(h.t)} · ${h.h.precipitation??0} mm"></i>`).join("")}</div></div>
        <div class="hours"><span></span>${lab}</div>
      </div>
      <div class="why">Pico ${hhmm(peak.t)}: <span>CAPE <em>${Math.round(peak.h.cape??0)}</em></span><span>Cizalladura <em>${peak.sh} km/h</em></span><span>0° a <em>${((peak.h.freezing_level_height??0)/1000).toFixed(1)} km</em></span><span>Índice <em>${peak.hs}/100</em></span></div>
    </section>`}).join("");
}

async function load(){
  const url=`https://api.open-meteo.com/v1/forecast?latitude=${PLACES.map(p=>p.lat)}&longitude=${PLACES.map(p=>p.lon)}&hourly=${VARS}&forecast_hours=36&timezone=America%2FArgentina%2FCordoba`;
  try{
    const r=await fetch(url);if(!r.ok) throw new Error(r.status);
    let j=await r.json();if(!Array.isArray(j)) j=[j];
    DATA=PLACES.map((p,i)=>({p,hours:analyze(j[i])}));
    $("#upd").textContent="Actualizado "+hhmm(Date.now())+" · se renueva cada 30 min";
  }catch(e){
    if(!DATA.length) DATA=PLACES.map(p=>({p}));
    $("#upd").textContent=(location.protocol==="file:"?"No pude bajar el pronóstico. Revisá tu conexión.":"Esta vista previa bloquea internet: descargá el archivo y abrilo con doble clic en Chrome.");
  }
  render();check();
}


/* --- Mapa de riesgo propio: cuadrícula sobre la zona, mismo análisis, hora por hora --- */
let GRID={lat0:-31.02,lat1:-31.90,lon0:-64.72,lon1:-63.66,n:9},DGRID=null,gzoom=0,gload=0,gabort=null,gloading=false;const gcache=new Map();
const HOME=[-31.42,-64.19],HOMEZ=10.5;
let graw=null,gmap,gimg,gcv=document.createElement("canvas"),gcells=[],gdata=null,gmode="rain",gidx=0,gplaying=true,gtimer=null,gpins=[];
const RED="#ff3b4f",ORG="#ff9d2e";
const RAINC=[[.2,"#5ad8e6"],[.5,"#2f4bff"],[1,"#6ef05a"],[2,"#2e9e3a"],[4,"#ffe14a"],[8,"#ff9d2e"],[15,"#ff3b4f"],[30,"#b0122a"]];
const LEG={hail:[[ORG,"Granizo posible"],[RED,"Granizo probable"]],rain:[["#5ad8e6","Débil"],["#6ef05a","Moderada"],["#ffe14a","Fuerte"],[RED,"Muy fuerte"]]};
function gridPts(g=GRID){const pts=[];for(let r=0;r<g.n;r++)for(let c=0;c<g.n;c++)
  pts.push({lat:g.lat0+(g.lat1-g.lat0)*(r+.5)/g.n,lon:g.lon0+(g.lon1-g.lon0)*(c+.5)/g.n});return pts}
/* Lluvia: colores tipo radar según mm/h. Granizo: solo donde además se espera lluvia. */
function cellStyle(h){
  const mm=h.h.precipitation??0;
  if(gmode==="hail"){if(mm<.5||!h.hl)return[null,0];return[h.hl===2?RED:ORG,.7]}
  let c=null;for(const[t,col]of RAINC)if(mm>=t)c=col;return[c,c?.68:0];
}
function initGrid(){
  if(!window.L){$("#map").innerHTML='<p style="padding:16px">No se pudo cargar el mapa.</p>';return}
  gmap=L.map("map",{zoomSnap:.25,attributionControl:true,minZoom:6}).setView(HOME,HOMEZ);
  let touched=false;const el=document.getElementById("map");
  ["pointerdown","wheel","touchstart"].forEach(ev=>el.addEventListener(ev,()=>touched=true,{passive:true}));
  const fit=()=>{gmap.invalidateSize();const sz=gmap.getSize();if(!touched&&sz.x>80&&sz.y>80)gmap.setView(HOME,HOMEZ,{animate:false})};
  new ResizeObserver(fit).observe(el);setTimeout(fit,300);
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}",{maxZoom:13,attribution:"Mapa © Esri · Datos Open-Meteo"}).addTo(gmap);
  gmap.createPane("risk").style.zIndex=350;gmap.getPane("risk").classList.add("risk-pane");gmap.getPane("risk").style.pointerEvents="none";
  gmap.createPane("labels").style.zIndex=450;gmap.getPane("labels").style.pointerEvents="none";
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}",{maxZoom:13,pane:"labels"}).addTo(gmap);
  const pts=gridPts(),a=pts[0],b=pts[pts.length-1];
  gimg=L.imageOverlay("data:image/gif;base64,R0lGODlhAQABAAAAACw=",[[a.lat,a.lon],[b.lat,b.lon]],{pane:"risk",interactive:false}).addTo(gmap);
  gpins=PLACES.map((p,i)=>L.marker([p.lat,p.lon],{icon:L.divIcon({className:"",html:`<div class="pin" style="--c:${i?"var(--hail)":"var(--rain)"};background:${i?"var(--hail)":"var(--rain)"}"></div>`,iconSize:[16,16],iconAnchor:[8,8]})})
    .addTo(gmap).bindTooltip(p.name,{permanent:true,direction:"right",offset:[10,0],className:"lbl"}));
  setMode("rain");
  let deb=null;gmap.on("moveend",()=>{clearTimeout(deb);deb=setTimeout(maybeReload,600)});
  setTimeout(maybeReload,900);
}
/* Al mover o hacer zoom: si la vista sale de la zona con datos, o cambia mucho el zoom, baja datos de la zona nueva */
function maybeReload(){
  const sz=gmap.getSize();if(sz.x<80||sz.y<80)return;
  const v=gmap.getBounds();
  if(DGRID){const inside=v.getNorth()<=DGRID.lat0&&v.getSouth()>=DGRID.lat1&&v.getWest()>=DGRID.lon0&&v.getEast()<=DGRID.lon1;
    if(inside&&Math.abs(gmap.getZoom()-gzoom)<1.5)return}
  loadGrid();
}
/* Pasa el análisis horario a pasos de 15 min: granizo interpolado entre horas, lluvia con datos cada 15 min */
function to15(raw){
  const hrs=analyze(raw),off=raw.utc_offset_seconds*1000,M=raw.minutely_15||{time:[],precipitation:[]};
  const mt=M.time.map(t=>Date.parse(t+":00Z")-off),now=Date.now(),out=[];
  let t=Math.floor(now/9e5)*9e5;
  for(let k=0;k<9;k++,t+=9e5){
    let i=hrs.findIndex((h,n)=>hrs[n+1]&&hrs[n+1].t>t);if(i<0)break;
    const a=hrs[i],b=hrs[i+1],f=Math.max(0,Math.min(1,(t-a.t)/36e5));
    const hs=Math.round(a.hs+(b.hs-a.hs)*f);
    const mi=mt.findIndex(x=>x>=t);const p15=mi>=0?(M.precipitation[mi]??0):((a.h.precipitation??0)/4);
    const rate=p15*4,rl=rate>=15?2:rate>=6?1:0;
    out.push({t,hs,hl:hailLevel(hs),rl,h:{precipitation:rate}});
  }
  return out;
}
async function loadGrid(force){
  if(!gmap)return;
  const b=gmap.getBounds().pad(.25),r=x=>Math.round(x*20)/20;
  const g={lat0:r(b.getNorth()),lat1:r(b.getSouth()),lon0:r(b.getWest()),lon1:r(b.getEast()),n:8};
  const key=[g.lat0,g.lat1,g.lon0,g.lon1].join(),z=gmap.getZoom(),id=++gload;
  const hit=gcache.get(key);
  if(hit&&!force&&Date.now()-hit.t<36e5){applyGrid(g,z,hit.raw);return}
  gloading=true;if(!gdata)$("#mtime").textContent="Cargando…";else showGrid(gidx);
  gabort?.abort();gabort=new AbortController();
  const pts=gridPts(g);
  const url=`https://api.open-meteo.com/v1/forecast?latitude=${pts.map(p=>p.lat.toFixed(3))}&longitude=${pts.map(p=>p.lon.toFixed(3))}&hourly=${VARS}&minutely_15=precipitation&forecast_hours=26&forecast_minutely_15=60&timezone=America%2FArgentina%2FCordoba`;
  try{let j=await (await fetch(url,{signal:gabort.signal})).json();if(!Array.isArray(j))j=[j];
    if(id!==gload)return;gcache.set(key,{t:Date.now(),raw:j});if(gcache.size>12)gcache.delete(gcache.keys().next().value);
    gloading=false;applyGrid(g,z,j);
  }catch(e){if(e.name==="AbortError")return;gloading=false;if(!gdata)$("#mtime").textContent="Sin datos";else showGrid(gidx)}
}
function applyGrid(g,z,j){
  DGRID=g;gzoom=z;graw=j;gdata=j.map(x=>to15(x));
  const pts=gridPts(g),a=pts[0],b=pts[pts.length-1];gimg.setBounds(L.latLngBounds([a.lat,a.lon],[b.lat,b.lon]));
  $("#mslider").max=gdata[0].length-1;showGrid(Math.min(gidx,gdata[0].length-1));playGrid(gplaying);
}
function nearest(p){if(!DGRID||p.lat>DGRID.lat0||p.lat<DGRID.lat1||p.lon<DGRID.lon0||p.lon>DGRID.lon1)return -1;let b=0,d=1e9;gridPts(DGRID).forEach((q,k)=>{const e=(q.lat-p.lat)**2+(q.lon-p.lon)**2;if(e<d){d=e;b=k}});return b}
/* Dibuja manchas suaves: interpola la grilla (bilineal) y pinta por umbrales, como un radar */
function hexRGB(h){return[1,3,5].map(k=>parseInt(h.slice(k,k+2),16))}
function drawField(i){
  const n=DGRID.n,W=420;gcv.width=gcv.height=W;const x=gcv.getContext("2d"),img=x.createImageData(W,W),d=img.data;
  const v=gdata.map(r=>{const h=r[i];if(!h)return 0;const mm=h.h.precipitation??0;return gmode==="hail"?(mm>=.5?h.hl:0):mm});
  const scale=gmode==="hail"?[[.5,ORG],[1.5,RED]]:RAINC,cols=scale.map(([t,c])=>[t,hexRGB(c)]);
  for(let py=0;py<W;py++){const gy=py/(W-1)*(n-1),r0=Math.min(n-2,Math.floor(gy)),fy=gy-r0;
    for(let px=0;px<W;px++){const gx=px/(W-1)*(n-1),c0=Math.min(n-2,Math.floor(gx)),fx=gx-c0;
      const val=(v[r0*n+c0]*(1-fx)+v[r0*n+c0+1]*fx)*(1-fy)+(v[(r0+1)*n+c0]*(1-fx)+v[(r0+1)*n+c0+1]*fx)*fy;
      let c=null;for(const[t,rgb]of cols)if(val>=t)c=rgb;
      if(c){const e=Math.min(px,py,W-1-px,W-1-py),fade=Math.min(1,e/55);const o=(py*W+px)*4;d[o]=c[0];d[o+1]=c[1];d[o+2]=c[2];d[o+3]=175*fade}}}
  x.putImageData(img,0,0);gimg.setUrl(gcv.toDataURL());
}
function showGrid(i){
  if(!gdata)return;gidx=i;
  drawField(i);
  const t=gdata[0][i].t,mn=i*15;$("#mtime").textContent=(i===0?"Ahora":`${hhmm(t)} · +${Math.floor(mn/60)}:${String(mn%60).padStart(2,"0")}`)+(gloading?" ↻":"");$("#mslider").value=i;
  gpins.forEach((m,k)=>{const h=gdata[nearest(PLACES[k])]?.[i];if(!h){m.setTooltipContent(PLACES[k].name);return}
    m.setTooltipContent(`${PLACES[k].name} · ${gmode==="hail"?`granizo ${h.hs}%`:`${(h.h.precipitation??0).toFixed(1)} mm/h`}`)});
}
function setMode(m){gmode=m;$("#b-hail").setAttribute("aria-pressed",m==="hail");$("#b-rain").setAttribute("aria-pressed",m==="rain");
  $("#mleg").innerHTML=LEG[m].map(([c,t])=>`<span><i style="background:${c}"></i>${t}</span>`).join("");showGrid(gidx)}
function playGrid(on){gplaying=on;clearInterval(gtimer);$("#mplay").textContent=on?"❚❚":"▶";$("#mplay").setAttribute("aria-label",on?"Pausar":"Reproducir");
  if(on&&gdata)gtimer=setInterval(()=>showGrid((gidx+1)%gdata[0].length),900)}
$("#mplay").onclick=()=>playGrid(!gplaying);
$("#mslider").oninput=e=>{playGrid(false);showGrid(+e.target.value)};
const switchMode=m=>{gidx=0;setMode(m);playGrid(true)};
$("#b-hail").onclick=()=>switchMode("hail");$("#b-rain").onclick=()=>switchMode("rain");

/* --- Pantalla completa del mapa --- */
const ICO_OPEN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg>';
const ICO_CLOSE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10h-6V4M4 14h6v6M14 10l7-7M10 14l-7 7"/></svg>';
function setFull(on){document.body.classList.toggle("mapfull",on);
  const mini=$("#mini"),sh=$(".sathead");if(on)sh.insertBefore(mini,sh.querySelector(".seg"));else $(".wrap").insertBefore(mini,$(".sat"));const b=$("#mfull");b.innerHTML=on?ICO_CLOSE:ICO_OPEN;
  b.setAttribute("aria-label",on?"Achicar mapa":"Agrandar mapa");b.title=on?"Volver":"Agrandar mapa";scrollTo(0,0);
  setTimeout(()=>gmap&&gmap.invalidateSize(),60);setTimeout(()=>gmap&&gmap.invalidateSize(),400)}
$("#mfull").onclick=()=>setFull(!document.body.classList.contains("mapfull"));
addEventListener("keydown",e=>{if(e.key==="Escape"&&document.body.classList.contains("mapfull"))setFull(false)});
setFull(false);
function renderMini(){
  const ok=DATA.filter(d=>d.hours);if(!ok.length){$("#mini").innerHTML="";return}
  let w={lv:0,hs:0};for(const d of ok)for(const h of d.hours.slice(0,12)){const lv=Math.max(h.hl,h.rl);if(lv>w.lv||(lv===w.lv&&h.hs>w.hs))w={lv,hs:h.hs}}
  $("#mini").innerHTML=`<span class="abadge a${w.lv}">${["Verde","Naranja","Roja"][w.lv]} ${w.hs}%</span>`+ok.map(d=>{const f=d.hours.slice(0,12),mh=Math.max(...f.map(h=>h.hl)),mr=Math.max(...f.map(h=>h.rl)),pc=Math.max(...f.map(h=>h.hs));
    return `<span class="chip">${d.p.name.split(" ")[0]} <span class="l${mh}">${ic("hail",16)}${pc}%</span><span class="l${mr}">${ic("rain",16)}${LVL[mr]}</span></span>`}).join("");
}

/* --- Avisos: 2 h y 1 h antes del inicio de cada tramo de riesgo --- */
function notify(title,body){
  if("Notification" in window && Notification.permission==="granted"){try{new Notification(title,{body,requireInteraction:true})}catch(e){}}
  const t=$("#toast");t.innerHTML=ic("storm",30)+"<span></span>";t.lastChild.textContent=title+" — "+body;t.hidden=false;setTimeout(()=>t.hidden=true,20000);
  try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.frequency.value=880;o.connect(a.destination);o.start();o.stop(a.currentTime+.35)}catch(e){}
  document.title="⚠ "+title;
}
function check(){
  if(!store.get("avisos")) return;
  const sent=store.get("sent")||{}, now=Date.now();
  for(const d of DATA){ if(!d.hours) continue;
    for(const e of episodes(d.hours)){
      const m=(e.t-now)/60000;
      for(const [tag,lo,hi] of [["2h",95,125],["1h",40,65]]){
        const key=d.p.id+e.t+tag;
        if(m>=lo&&m<=hi&&!sent[key]){sent[key]=now;notify(`${tag==="2h"?"En 2 horas":"En 1 hora"}: ${d.p.name}`,`${describe(e)} desde las ${hhmm(e.t)}`)}
      }
    }
  }
  for(const k in sent) if(now-sent[k]>2*864e5) delete sent[k];
  store.set("sent",sent);
}
function syncBtn(){const on=!!store.get("avisos");const b=$("#notif");b.classList.toggle("on",on);b.innerHTML=ic("bell",20)+`<span class="bt">${on?"Avisos activos":"Activar avisos 2 h y 1 h antes"}</span>`;b.title=on?"Avisos activos · tocá para apagar":"Activar avisos 2 h y 1 h antes"}
$("#notif").addEventListener("click",async()=>{
  const on=!store.get("avisos");
  if(on&&"Notification" in window&&Notification.permission==="default"){try{await Notification.requestPermission()}catch(e){}}
  store.set("avisos",on);syncBtn();check();
});
syncBtn();load();initGrid();setInterval(()=>loadGrid(true),60*60e3);setInterval(()=>{if(graw){gdata=graw.map(x=>to15(x));showGrid(Math.min(gidx,gdata[0].length-1))}},15*60e3);
setInterval(load,30*60e3);setInterval(check,60e3);
</script>
