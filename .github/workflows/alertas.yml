name: Avisos de granizo y lluvia

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alertas
  cancel-in-progress: false

jobs:
  avisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Analizar pronóstico y avisar
        run: node alerts.mjs
      - name: Guardar avisos enviados
        run: |
          git config user.name "rain-meter-bot"
          git config user.email "rain-meter-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "Avisos enviados [skip ci]" && git push)
