name: Radar SMN Córdoba

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: true

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Bajar lista del radar
        run: node radar.mjs
      - name: Guardar
        run: |
          git config user.name "rain-meter-bot"
          git config user.email "rain-meter-bot@users.noreply.github.com"
          for f in radar.json radar-debug.txt; do [ -f $f ] && git add $f; done
          git diff --cached --quiet || (git commit -m "Radar actualizado [skip ci]" && git pull --rebase -q && git push)
