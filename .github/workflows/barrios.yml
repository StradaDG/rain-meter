name: Barrios con granizo

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: barrios
  cancel-in-progress: true

jobs:
  barrios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Buscar barrios en noticias
        run: node barrios.mjs
      - name: Guardar
        run: |
          git config user.name "rain-meter-bot"
          git config user.email "rain-meter-bot@users.noreply.github.com"
          git add granizo.json
          git diff --cached --quiet || (git commit -m "Barrios con granizo [skip ci]" && git pull --rebase -q && git push)
