name: diag
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: pip install -q h5py numpy && python3 glm.py
      - run: NTFY_TOPIC=rainmeter-test-0000 node alerts.mjs
      - run: node -e 'const f=require("./fusion.json");for(const k in f.places){const p=f.places[k];console.log(k,JSON.stringify(p.smn),JSON.stringify(p.glm));p.hours.slice(0,8).forEach(h=>console.log(new Date(h.t).toISOString().slice(11,16),h.p,"ens",h.ens,h.agree+"/"+h.n,JSON.stringify(h.mod),"smn",h.smn,"ray",h.ray,h.rayTxt))}'
