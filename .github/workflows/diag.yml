name: Diagnostico
on: workflow_dispatch
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node diag.mjs
      - run: |
          git config user.name "rain-meter-bot"
          git config user.email "rain-meter-bot@users.noreply.github.com"
          git add diag.json && git commit -m "diag [skip ci]" && git pull --rebase -q && git push
